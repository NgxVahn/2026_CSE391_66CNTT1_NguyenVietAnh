<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANG DIEM SINH VIEN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>BANG DIEM SINH VIEN</h2>

    <label> Họ tên:
        <input type="text" id="hoten">
    </label>
    <label> Điểm:
        <input type="number" id="diem" min="0" max="10" step="0.1">
    </label>
    <button id="btnThem">Thêm</button>

    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Họ tên</th>
                <th>Điểm</th>
                <th>Xếp loại</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody id="tbodySV"></tbody>
    </table>

    <p id="thongKe">Tổng số sinh viên: 0 | Điểm trung bình: 0</p>
    <script src="main.js"></script>
</body>
</html>
