<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAT HANG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Đặt hàng trực tuyến</h2>

  <form id="orderForm">
    <div class="form-group">
      <label for="product">Tên sản phẩm</label>
      <select id="product">
        <option value="">-- Chọn sản phẩm --</option>
        <option value="Ao">Áo thun</option>
        <option value="Quan">Quần jean</option>
        <option value="Giay">Giày sneaker</option>
      </select>
      <div id="unitPrice">Giá: 0 ₫</div>
      <span class="error" id="productError"></span>
    </div>

    <div class="form-group">
      <label for="quantity">Số lượng (1–99)</label>
      <input type="number" id="quantity" min="1" max="99" />
      <span class="error" id="quantityError"></span>
    </div>

    <div class="form-group">
      <label for="deliveryDate">Ngày giao hàng</label>
      <input type="date" id="deliveryDate" />
      <span class="error" id="deliveryDateError"></span>
    </div>

    <div class="form-group">
      <label for="address">Địa chỉ giao</label>
      <textarea id="address" rows="2"></textarea>
      <span class="error" id="addressError"></span>
    </div>

    <div class="form-group">
      <label for="note">Ghi chú (không bắt buộc, ≤ 200 ký tự)</label>
      <textarea id="note" rows="3"></textarea>
      <div class="note-counter">
        <span id="noteCounter">0/200</span>
      </div>
      <span class="error" id="noteError"></span>
    </div>

    <div class="form-group" id="paymentGroup">
      <span>Phương thức thanh toán</span><br />
      <label><input type="radio" name="payment" value="COD" /> COD</label>
      <label><input type="radio" name="payment" value="Bank" /> Chuyển khoản</label>
      <label><input type="radio" name="payment" value="EWallet" /> Ví điện tử</label>
      <span class="error" id="paymentError"></span>
    </div>

     <div class="form-group">
      <label>Tổng tiền</label>
      <div id="totalPrice">0 ₫</div>
    </div>

    <button type="submit">Đặt hàng</button>
  </form>

  <div id="confirmBox" class="hidden">
    <h3>Xác nhận đặt hàng?</h3>
    <div id="orderSummary"></div>
    <button id="confirmBtn">Xác nhận</button>
    <button id="cancelBtn" type="button">Hủy</button>
  </div>
  <div id="successMessage" class="hidden"></div>
  <script src="main.js"></script>
    
</body>
</html>
